name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  adapter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ziglang==0.14.1
      - name: Build native launcher
        shell: python
        run: |
          import pathlib, subprocess, sys, ziglang
          zig = pathlib.Path(ziglang.__file__).parent / ('zig.exe' if sys.platform == 'win32' else 'zig')
          subprocess.run([sys.executable, 'tools/build.py', '--zig', str(zig)], check=True)
      - run: python -m unittest discover -s tests -v
      - run: python tools/versioning.py --check
      - run: python tools/release.py
